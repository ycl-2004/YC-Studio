name: ycstudio

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ycstudio-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      YCSTUDIO_ENV_FILE: ""
      DATABASE_HOST_OVERRIDE: db
      DATABASE_PORT_OVERRIDE: "5432"
      REDIS_HOST_OVERRIDE: redis
      REDIS_PORT_OVERRIDE: "6379"
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads

  worker:
    image: ycstudio-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      YCSTUDIO_ENV_FILE: ""
      DATABASE_HOST_OVERRIDE: db
      DATABASE_PORT_OVERRIDE: "5432"
      REDIS_HOST_OVERRIDE: redis
      REDIS_PORT_OVERRIDE: "6379"
      RUN_MIGRATIONS: "0"
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    # The image's HEALTHCHECK curls :8000/health, which only the backend service
    # serves. ARQ has no HTTP endpoint, so that probe would always fail here and
    # report a running worker as "unhealthy" — disable it rather than lie.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads

  frontend:
    image: ycstudio-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  upload_data:
