[project]
name = "ycstudio"
version = "0.1.0"
description = "Knowledge-base driven content generation studio"
requires-python = ">=3.12,<3.14"

# Stage 0 依赖。后续 Stage 需要什么自己加，别一次装全。
dependencies = [
    "fastapi",              # Step 6
    "uvicorn[standard]",    # Step 6
    "pydantic-settings",    # Step 2
    "sqlalchemy[asyncio]",  # Step 4
    "asyncpg",              # Step 4
    "alembic",              # Step 5
    "structlog",            # Step 7
    "redis",                # Step 8
]

[dependency-groups]
dev = [
    "pytest",           # Step 9
    "pytest-asyncio",   # Step 9
    "httpx",            # Step 9
    "ruff",             # Step 10
    "mypy",             # Step 10
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycstudio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
