<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YC Studio</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ff; color: #24183d; }
      main { width: min(560px, calc(100% - 48px)); padding: 40px; border: 1px solid #ded4f2; border-radius: 20px; background: white; box-shadow: 0 18px 50px rgb(63 38 103 / 10%); }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -0.05em; }
      p { margin: 0 0 24px; line-height: 1.7; color: #685a7f; }
      a { color: #6936c5; font-weight: 650; }
      code { padding: 3px 7px; border-radius: 6px; background: #f0eafa; }
    </style>
  </head>
  <body>
    <main>
      <h1>YC Studio</h1>
      <p>Stage 0 的全栈容器已经运行。这里暂时是前端占位页，正式 Vue 界面会在 Stage 4 实现。</p>
      <a href="http://localhost:8000/docs">打开 Backend API 文档</a>
      <p style="margin-top: 24px; margin-bottom: 0"><code>frontend → backend → db / redis</code></p>
    </main>
  </body>
</html>
