server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback: unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API. Without this the SPA history fallback answers /api/... with
  # index.html, so a non-mock build fails on an HTML body instead of a 404.
  location /api/ {
    # nginx resolves a literal upstream name once at startup and caches it forever,
    # so every backend container restart hands it a new IP it never picks up and the
    # API answers 502 until nginx itself is restarted. Going through a variable defers
    # resolution to request time against Docker's embedded DNS; with a variable
    # upstream the URI is no longer passed implicitly, hence the explicit $request_uri.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uploads are capped at 10 MB by the backend; let nginx pass that through
    # rather than reject it first with its own 1 MB default.
    client_max_body_size 12m;
    proxy_read_timeout 300s;
  }

  # Cache hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
